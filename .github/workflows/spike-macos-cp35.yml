name: spike-macos-cp35
# THROWAWAY (route a = conda): python.org 3.5.4 crashes on macOS 15 (CoreFoundation/dyld).
# Try conda-forge python 3.5.5 (x86_64-only, possibly relocatable enough to run). If
# `python --version` runs, build the patched cp35 wheel with the era recipe.
on:
  push:
    branches: [spike/macos-cp35]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout (patched aiohttp 3.0.8 fork)
        uses: actions/checkout@v4

      - name: Environment dump
        run: |
          set -x
          sw_vers; clang --version; uname -m

      - name: Conda python 3.5 + build cp35 wheel (one step — keeps env active)
        env:
          CFLAGS: "-Wno-error=implicit-function-declaration -Wno-error=implicit-int"
          ARCHFLAGS: "-arch x86_64"
          MACOSX_DEPLOYMENT_TARGET: "10.12"
        run: |
          set -euxo pipefail
          curl -fsSL -o mf.sh https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-MacOSX-x86_64.sh
          bash mf.sh -b -p "$HOME/mf"
          source "$HOME/mf/etc/profile.d/conda.sh"
          conda create -y -n py35 -c conda-forge python=3.5.5
          conda activate py35
          echo "=== CRUCIAL: does conda 3.5 run on macOS 15? ==="
          python --version
          python -c "import platform; print('ok', platform.python_version(), platform.machine())"
          python -m pip install 'cython==0.27.3' 'wheel==0.30.0' 'setuptools<46'
          echo "=== build ==="
          python setup.py bdist_wheel -d wheelhouse
          ls -la wheelhouse/
          echo "=== inspect ==="
          W=$(ls wheelhouse/*.whl | head -1)
          unzip -l "$W" | grep -E "dist-info/" || true
          unzip -p "$W" "aiohttp-3.0.8.dist-info/WHEEL" || true
          rm -rf /tmp/wh && mkdir -p /tmp/wh && (cd /tmp/wh && unzip -o "$GITHUB_WORKSPACE/$W" >/dev/null)
          SO=$(ls /tmp/wh/aiohttp/_vendored/_brotli*.so)
          echo "== .so archs =="; lipo -info "$SO" || file "$SO"
          echo "=== runtime .so load on cp35 ==="
          python -c "import importlib.util as u; s=u.spec_from_file_location('_brotli', '$SO'); m=u.module_from_spec(s); s.loader.exec_module(m); print('vendored _brotli loaded OK on cp35:', m); print('api:', [a for a in dir(m) if not a.startswith('__')])"

      - name: Upload wheel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiohttp-308-cp35-macos
          path: wheelhouse/*.whl
          if-no-files-found: warn
