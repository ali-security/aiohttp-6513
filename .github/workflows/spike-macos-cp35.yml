name: spike-macos-cp35
# THROWAWAY: cp35 is the harder tier — cibuildwheel can't fetch it, so build MANUALLY.
# Install python.org 3.5.4 .pkg on macos-15-intel, bootstrap a working pip (old pip can't
# reach PyPI), then setup.py bdist_wheel with the era recipe (cython 0.27.3, wheel 0.30.0,
# clang-17 mitigation, x86_64-only, target 10.12). Uploads the wheel as a run artifact.
on:
  push:
    branches: [spike/macos-cp35]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout (patched aiohttp 3.0.8 fork)
        uses: actions/checkout@v4

      - name: Environment dump
        run: |
          set -x
          sw_vers; clang --version; uname -m

      - name: Install Python 3.5.4 (python.org .pkg)
        run: |
          set -euxo pipefail
          curl -fsSLO https://www.python.org/ftp/python/3.5.4/python-3.5.4-macosx10.6.pkg
          sudo installer -pkg python-3.5.4-macosx10.6.pkg -target /
          /Library/Frameworks/Python.framework/Versions/3.5/bin/python3 --version

      - name: Bootstrap pip + era build toolchain
        run: |
          set -euxo pipefail
          PY=/Library/Frameworks/Python.framework/Versions/3.5/bin/python3
          curl -fsSLO https://bootstrap.pypa.io/pip/3.5/get-pip.py
          "$PY" get-pip.py
          "$PY" -m pip install 'cython==0.27.3' 'wheel==0.30.0' 'setuptools<46'
          "$PY" -m pip list

      - name: Build cp35 wheel (manual, era recipe, x86_64-only)
        env:
          CFLAGS: "-Wno-error=implicit-function-declaration -Wno-error=implicit-int"
          ARCHFLAGS: "-arch x86_64"
          MACOSX_DEPLOYMENT_TARGET: "10.12"
        run: |
          set -euxo pipefail
          PY=/Library/Frameworks/Python.framework/Versions/3.5/bin/python3
          "$PY" setup.py bdist_wheel -d wheelhouse
          ls -la wheelhouse/

      - name: Inspect wheel (tag, dist-info, Generator, .so archs)
        if: always()
        run: |
          set -x
          W=$(ls wheelhouse/*.whl | head -1) || exit 0
          basename "$W"
          unzip -l "$W" | grep -E "dist-info/" || true
          unzip -p "$W" "aiohttp-3.0.8.dist-info/WHEEL" || true
          rm -rf /tmp/wh && mkdir -p /tmp/wh && (cd /tmp/wh && unzip -o "$GITHUB_WORKSPACE/$W" >/dev/null)
          SO=$(ls /tmp/wh/aiohttp/_vendored/_brotli*.so)
          echo "== .so archs (want x86_64 only) =="; lipo -info "$SO" || file "$SO"
          echo "== .so min-version =="; otool -l "$SO" | grep -A3 -iE "VERSION_MIN|BUILD_VERSION" | grep -iE "version|minos" | head

      - name: Runtime sanity — load vendored brotli .so on cp35 (dep-free)
        run: |
          set -x
          PY=/Library/Frameworks/Python.framework/Versions/3.5/bin/python3
          SO=$(ls /tmp/wh/aiohttp/_vendored/_brotli*.so)
          "$PY" -c "import importlib.util as u; s=u.spec_from_file_location('_brotli', '$SO'); m=u.module_from_spec(s); s.loader.exec_module(m); print('vendored _brotli loaded OK on cp35:', m); print('api:', [a for a in dir(m) if not a.startswith('__')])"

      - name: Upload wheel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiohttp-308-cp35-macos
          path: wheelhouse/*.whl
          if-no-files-found: warn
